<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arpent</title>
  <meta name="description" content="Capturer des séquences de photos géolocalisées et les publier sur Panoramax.">
  <meta name="theme-color" content="#0f6b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arpent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Mode (démo par défaut) appliqué avant l'affichage : thème et couleur de barre d'état.
    (function () {
      var p = new URLSearchParams(location.search), m = p.has('live') ? 'live' : p.has('demo') ? 'demo' : null;
      try { m = m || localStorage.getItem('arpent.mode'); } catch (e) {}
      m = m === 'live' ? 'live' : 'demo';
      document.documentElement.dataset.mode = m;
      document.querySelector('meta[name=theme-color]').content = m === 'live' ? '#0f6b4f' : '#5b47c7';
    })();
  </script>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" hidden></div>
  <noscript>Arpent a besoin de JavaScript.</noscript>
</body>
</html>
